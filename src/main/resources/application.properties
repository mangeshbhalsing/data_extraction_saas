spring.application.name=data-extraction-saas
server.port=8080
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/extractiq;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=30m
management.endpoints.web.exposure.include=health,info
app.security.seed-demo-users=${APP_SEED_DEMO_USERS:false}
app.security.cookie-secure=${APP_COOKIE_SECURE:false}
server.servlet.session.cookie.name=EXTRACTIQ_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${APP_COOKIE_SECURE:false}
app.upload.max-file-size-bytes=20971520
app.upload.session-ttl-seconds=300
app.quotas.max-documents=${APP_MAX_DOCUMENTS:100}
app.quotas.max-storage-bytes=${APP_MAX_STORAGE_BYTES:1073741824}
